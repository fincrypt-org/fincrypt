services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: fincrypt
      POSTGRES_PASSWORD: fincrypt
      POSTGRES_DB: fincrypt
    # No host port mapping: CI runs both the postgres service container
    # (host 5432 for go tests) and `compose up` in the same job — a
    # published port would collide. The app reaches postgres over the
    # internal compose network.
    expose:
      - "5432"
    volumes:
      - fincrypt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincrypt -d fincrypt"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      ENV: ${APP_ENV:-prod}
      PORT: "8080"
      LOG_LEVEL: info
      DEV_ORIGIN: ${APP_DEV_ORIGIN:-}
      RATE_AUTH_PER_MIN: ${APP_RATE_AUTH_PER_MIN:-}
      DATABASE_URL: postgres://fincrypt:fincrypt@postgres:5432/fincrypt?sslmode=disable
      # dev key placeholder for compose smoke only; prod injects real secrets
      SESSION_KEYS: ${SESSION_KEYS:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm}
      # Compose smoke only: a throwaway OPAQUE setup so config.Load passes
      # and 001 applies. Prod generates its own with `server --gen-setup`
      # and keeps it persistent (see docs/OPAQUE-INTEROP.md).
      OPAQUE_SERVER_SETUP: ${OPAQUE_SERVER_SETUP:-OPXI0lEsAH5QzK4NQRzp8ZBpCd0Y+kg77ZaUNT6unJEyHmnlobDxAN7iorxqoOARUaicCC4vVmRAUK6bStoLmcPQA/lG2XjDKEyYxzcntaS+0VAsR4o31dmEKzTD4AwOUtiL87ns2pDt4jbWfOoYj0QxlDbFotrheaArQ5cORD0=}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fincrypt_pgdata: